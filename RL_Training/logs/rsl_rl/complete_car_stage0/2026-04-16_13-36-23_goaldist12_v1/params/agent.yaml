class_name: OnPolicyRunner
seed: 1
device: cuda:0
num_steps_per_env: 96
max_iterations: 300
obs_groups:
  actor:
  - actor
  critic:
  - critic
clip_actions: 1.0
check_for_nan: true
save_interval: 100
experiment_name: complete_car_stage0
run_name: goaldist12_v1
logger: tensorboard
neptune_project: complete_car
wandb_project: complete_car
resume: false
load_run: .*
load_checkpoint: model_.*.pt
actor:
  class_name: MLPModel
  hidden_dims:
  - 256
  - 128
  - 64
  activation: elu
  obs_normalization: true
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 0.35
    std_type: scalar
critic:
  class_name: MLPModel
  hidden_dims:
  - 256
  - 128
  - 64
  activation: elu
  obs_normalization: true
  distribution_cfg: null
algorithm:
  class_name: PPO
  num_learning_epochs: 4
  num_mini_batches: 4
  learning_rate: 0.0002
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.002
  desired_kl: 0.008
  max_grad_norm: 0.7
  value_loss_coef: 0.7
  use_clipped_value_loss: true
  clip_param: 0.2
