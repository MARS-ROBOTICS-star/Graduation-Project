[build-system]
requires = ["setuptools>=68", "wheel", "tomli; python_version < '3.11'"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "SIM", "RET"]
ignore = ["E402", "RET504", "RET505", "SIM102", "SIM108", "UP006"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pyright]
include = ["scripts", "source/complete_car_lab/complete_car_lab"]
exclude = ["**/__pycache__", ".git"]
typeCheckingMode = "basic"
pythonVersion = "3.10"
reportMissingImports = "none"
reportMissingModuleSource = "none"

[tool.codespell]
skip = "*.usd,*.usda,*.usdz,*.png,*.svg"
quiet-level = 0
