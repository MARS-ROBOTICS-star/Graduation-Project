<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#475569"/>
    </marker>
    <style>
      .title{font:700 30px "Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#0f172a}
      .box{rx:14;ry:14;stroke-width:2}
      .input{fill:#e0f2fe;stroke:#0284c7}
      .group{fill:#fef3c7;stroke:#d97706}
      .term{fill:#f8fafc;stroke:#64748b}
      .out{fill:#dcfce7;stroke:#16a34a}
      .text{font:500 20px "Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#0f172a}
      .small{font:500 17px "Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#334155}
      .line{stroke:#475569;stroke-width:2.3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="48" text-anchor="middle" class="title">MGDP Stage 1 Reward 结构图</text>

  <rect x="50" y="385" width="230" height="95" class="box input"/>
  <text x="165" y="423" text-anchor="middle" class="text">状态 s_t / 动作 a_t</text>
  <text x="165" y="454" text-anchor="middle" class="small">输入 reward 各分项</text>

  <rect x="350" y="385" width="230" height="95" class="box group"/>
  <text x="465" y="423" text-anchor="middle" class="text">Reward 各分项</text>
  <text x="465" y="454" text-anchor="middle" class="small">按类别组织</text>

  <rect x="665" y="70" width="230" height="75" class="box group"/>
  <text x="780" y="115" text-anchor="middle" class="text">跟踪奖励</text>
  <rect x="665" y="205" width="230" height="75" class="box group"/>
  <text x="780" y="250" text-anchor="middle" class="text">稳定性惩罚</text>
  <rect x="665" y="355" width="230" height="75" class="box group"/>
  <text x="780" y="400" text-anchor="middle" class="text">代价 / 效率惩罚</text>
  <rect x="665" y="510" width="230" height="75" class="box group"/>
  <text x="780" y="555" text-anchor="middle" class="text">步态 / 接触项</text>
  <rect x="665" y="665" width="230" height="75" class="box group"/>
  <text x="780" y="710" text-anchor="middle" class="text">地形自适应调制</text>

  <rect x="980" y="45" width="300" height="55" class="box term"/>
  <text x="1130" y="80" text-anchor="middle" class="small">phi_trk-lin = exp(-||c_xy - v_xy||^2 / sigma)</text>
  <rect x="980" y="112" width="300" height="55" class="box term"/>
  <text x="1130" y="147" text-anchor="middle" class="small">phi_trk-yaw = exp(-(c_psi - omega_z)^2 / sigma)</text>

  <rect x="980" y="190" width="300" height="50" class="box term"/>
  <text x="1130" y="222" text-anchor="middle" class="small">phi_vz = v_z^2</text>
  <rect x="980" y="250" width="300" height="50" class="box term"/>
  <text x="1130" y="282" text-anchor="middle" class="small">phi_wxy = omega_x^2 + omega_y^2</text>
  <rect x="980" y="310" width="300" height="50" class="box term"/>
  <text x="1130" y="342" text-anchor="middle" class="small">phi_ori / phi_col / phi_stum</text>

  <rect x="980" y="385" width="300" height="50" class="box term"/>
  <text x="1130" y="417" text-anchor="middle" class="small">phi_tau = sum(tau^2)</text>
  <rect x="980" y="445" width="300" height="50" class="box term"/>
  <text x="1130" y="477" text-anchor="middle" class="small">phi_qdd / phi_da</text>

  <rect x="980" y="535" width="300" height="50" class="box term"/>
  <text x="1130" y="567" text-anchor="middle" class="small">phi_trot = 对角步态对称惩罚</text>
  <rect x="980" y="595" width="300" height="50" class="box term"/>
  <text x="1130" y="627" text-anchor="middle" class="small">phi_air / phi_stand</text>

  <rect x="980" y="695" width="300" height="50" class="box term"/>
  <text x="1130" y="727" text-anchor="middle" class="small">hurdle / gap 调整系数</text>
  <rect x="980" y="755" width="300" height="50" class="box term"/>
  <text x="1130" y="787" text-anchor="middle" class="small">放松姿态、垂向速度、步态项</text>

  <rect x="1360" y="330" width="190" height="95" class="box out"/>
  <text x="1455" y="366" text-anchor="middle" class="text">加权求和</text>
  <text x="1455" y="396" text-anchor="middle" class="small">dt * sum w alpha phi</text>
  <rect x="1360" y="485" width="190" height="95" class="box out"/>
  <text x="1455" y="522" text-anchor="middle" class="text">非负截断</text>
  <text x="1455" y="552" text-anchor="middle" class="small">r = max(0, r_raw)</text>

