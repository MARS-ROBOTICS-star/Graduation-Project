<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="dashArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <style>
      .title{font:700 30px "Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#0f172a}
      .box{rx:16;ry:16;stroke-width:2}
      .blue{fill:#e0f2fe;stroke:#0284c7}
      .green{fill:#dcfce7;stroke:#16a34a}
      .amber{fill:#fef3c7;stroke:#d97706}
      .purple{fill:#ede9fe;stroke:#7c3aed}
      .red{fill:#fee2e2;stroke:#dc2626}
      .gray{fill:#f8fafc;stroke:#64748b}
      .text{font:500 21px "Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#0f172a}
      .small{font:500 18px "Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#334155}
      .line{stroke:#475569;stroke-width:2.6;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#dc2626;stroke-width:2.6;fill:none;stroke-dasharray:8 7;marker-end:url(#dashArrow)}
    </style>
  </defs>
  <rect width="1600" height="780" fill="#ffffff"/>
  <text x="800" y="48" text-anchor="middle" class="title">Stage1 奖励函数总逻辑链</text>

  <rect x="50" y="120" width="270" height="120" class="box blue"/>
  <text x="185" y="158" text-anchor="middle" class="text">观测输入</text>
  <text x="185" y="190" text-anchor="middle" class="small">目标、速度、球铰角</text>
  <text x="185" y="219" text-anchor="middle" class="small">轮速、接触、局部高度图</text>

  <rect x="390" y="120" width="270" height="120" class="box green"/>
  <text x="525" y="158" text-anchor="middle" class="text">地形特征提取</text>
  <text x="525" y="190" text-anchor="middle" class="small">terrain_features.py</text>
  <text x="525" y="219" text-anchor="middle" class="small">高度突变与支撑高度</text>

  <rect x="730" y="120" width="270" height="120" class="box green"/>
  <text x="865" y="154" text-anchor="middle" class="text">地形 gate</text>
  <text x="865" y="187" text-anchor="middle" class="small">g_step_up / g_drop</text>
  <text x="865" y="216" text-anchor="middle" class="small">g_gap / g_rough / g_flat</text>

  <rect x="1090" y="100" width="220" height="90" class="box amber"/>
  <text x="1200" y="135" text-anchor="middle" class="text">目标推进链</text>
  <text x="1200" y="166" text-anchor="middle" class="small">progress / reached</text>

  <rect x="1090" y="235" width="220" height="90" class="box amber"/>
  <text x="1200" y="270" text-anchor="middle" class="text">运动质量链</text>
  <text x="1200" y="301" text-anchor="middle" class="small">slip / support / stuck</text>

  <rect x="1090" y="370" width="220" height="100" class="box amber"/>
  <text x="1200" y="405" text-anchor="middle" class="text">地形动作链</text>
  <text x="1200" y="436" text-anchor="middle" class="small">front pitch / rear follow</text>

  <rect x="1370" y="230" width="180" height="105" class="box purple"/>
  <text x="1460" y="271" text-anchor="middle" class="text">PPO 更新</text>
  <text x="1460" y="303" text-anchor="middle" class="small">改变策略分布</text>

  <rect x="1090" y="565" width="220" height="95" class="box gray"/>
  <text x="1200" y="602" text-anchor="middle" class="text">命中目标点</text>
  <text x="1200" y="633" text-anchor="middle" class="small">waypoint_hit</text>

  <rect x="1370" y="540" width="180" height="120" class="box green"/>
  <text x="1460" y="582" text-anchor="middle" class="text">row 推进</text>
  <text x="1460" y="614" text-anchor="middle" class="small">curriculum</text>
  <text x="1460" y="642" text-anchor="middle" class="small">重新采样</text>

  <rect x="720" y="560" width="290" height="110" class="box red"/>
  <text x="865" y="598" text-anchor="middle" class="text">当前关键断点</text>
  <text x="865" y="631" text-anchor="middle" class="small">质量不足不会阻断 row</text>
  <text x="865" y="659" text-anchor="middle" class="small">high-row 不等于稳定技能</text>

  <path d="M320 180 H390" class="line"/>
  <path d="M660 180 H730" class="line"/>
  <path d="M1000 170 C1035 165 1055 145 1090 145" class="line"/>
  <path d="M1000 180 C1035 195 1055 250 1090 280" class="line"/>
  <path d="M1000 190 C1035 230 1055 365 1090 420" class="line"/>
  <path d="M1310 145 C1345 160 1350 240 1370 270" class="line"/>
  <path d="M1310 280 H1370" class="line"/>
  <path d="M1310 420 C1345 395 1350 325 1370 300" class="line"/>
  <path d="M1200 190 V565" class="line"/>
  <path d="M1310 612 H1370" class="line"/>
  <path d="M1090 280 C1000 360 940 490 900 560" class="dash"/>
  <path d="M1010 615 H1090" class="dash"/>
</svg>
