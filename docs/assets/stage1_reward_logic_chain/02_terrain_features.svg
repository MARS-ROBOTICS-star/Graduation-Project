<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#475569"/></marker>
    <style>
      .title{font:700 30px "Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#0f172a}
      .box{rx:15;ry:15;stroke-width:2}
      .input{fill:#e0f2fe;stroke:#0284c7}
      .feat{fill:#dcfce7;stroke:#16a34a}
      .gate{fill:#fef3c7;stroke:#d97706}
      .reward{fill:#ede9fe;stroke:#7c3aed}
      .text{font:500 21px "Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#0f172a}
      .small{font:500 18px "Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#334155}
      .line{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1500" height="720" fill="#fff"/>
  <text x="750" y="48" text-anchor="middle" class="title">地形识别链：局部高度图如何变成奖励激活条件</text>

  <rect x="60" y="285" width="230" height="105" class="box input"/>
  <text x="175" y="325" text-anchor="middle" class="text">局部高度图</text>
  <text x="175" y="356" text-anchor="middle" class="small">h_rel patch</text>

  <rect x="385" y="170" width="250" height="95" class="box feat"/>
  <text x="510" y="206" text-anchor="middle" class="text">未来高度突变</text>
  <text x="510" y="236" text-anchor="middle" class="small">step / drop / gap</text>

  <rect x="385" y="410" width="250" height="95" class="box feat"/>
  <text x="510" y="446" text-anchor="middle" class="text">模块支撑区域</text>
  <text x="510" y="476" text-anchor="middle" class="small">front / middle / rear 高度</text>

  <rect x="730" y="95" width="230" height="80" class="box gate"/>
  <text x="845" y="128" text-anchor="middle" class="text">g_step_up</text>
  <text x="845" y="154" text-anchor="middle" class="small">前方升高</text>

  <rect x="730" y="220" width="230" height="80" class="box gate"/>
  <text x="845" y="253" text-anchor="middle" class="text">g_step_down</text>
  <text x="845" y="279" text-anchor="middle" class="small">前方下降</text>

  <rect x="730" y="345" width="230" height="80" class="box gate"/>
  <text x="845" y="378" text-anchor="middle" class="text">g_gap</text>
  <text x="845" y="404" text-anchor="middle" class="small">宽坑 / gap</text>

  <rect x="730" y="500" width="230" height="90" class="box gate"/>
  <text x="845" y="534" text-anchor="middle" class="text">支撑高度</text>
  <text x="845" y="563" text-anchor="middle" class="small">front / middle / rear</text>

  <rect x="1070" y="120" width="310" height="100" class="box reward"/>
  <text x="1225" y="156" text-anchor="middle" class="text">台阶 / 上沿动作奖励</text>
  <text x="1225" y="187" text-anchor="middle" class="small">前车抬升、模块上升</text>

  <rect x="1070" y="300" width="310" height="100" class="box reward"/>
  <text x="1225" y="336" text-anchor="middle" class="text">下坑 / gap 抗栽头</text>
  <text x="1225" y="367" text-anchor="middle" class="small">drop guard 与姿态惩罚</text>

  <rect x="1070" y="500" width="310" height="100" class="box reward"/>
  <text x="1225" y="536" text-anchor="middle" class="text">模块进展 / 后车跟随</text>
  <text x="1225" y="567" text-anchor="middle" class="small">rear follow 与支撑质量</text>

  <path d="M290 325 C330 280 345 230 385 215" class="line"/>
  <path d="M290 360 C335 390 350 435 385 455" class="line"/>
  <path d="M635 205 C675 170 695 145 730 135" class="line"/>
  <path d="M635 225 C675 235 695 250 730 260" class="line"/>
  <path d="M635 245 C675 295 695 365 730 385" class="line"/>
  <path d="M635 455 C680 480 700 520 730 545" class="line"/>
  <path d="M960 135 C1005 140 1030 155 1070 170" class="line"/>
  <path d="M960 260 C1005 275 1030 320 1070 350" class="line"/>
  <path d="M960 385 C1005 380 1030 360 1070 350" class="line"/>
  <path d="M960 545 H1070" class="line"/>
</svg>
