<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="680" viewBox="0 0 1500 680">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#475569"/></marker>
    <style>
      .title{font:700 30px "Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#0f172a}
      .box{rx:15;ry:15;stroke-width:2}
      .gate{fill:#dcfce7;stroke:#16a34a}
      .state{fill:#e0f2fe;stroke:#0284c7}
      .penalty{fill:#fee2e2;stroke:#dc2626}
      .release{fill:#fef3c7;stroke:#d97706}
      .warn{fill:#fff7ed;stroke:#ea580c}
      .text{font:500 21px "Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#0f172a}
      .small{font:500 18px "Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#334155}
      .line{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1500" height="680" fill="#fff"/>
  <text x="750" y="48" text-anchor="middle" class="title">坑 / 下落差抗栽头链：先学会别栽头，不等于会出坑</text>

  <rect x="70" y="130" width="240" height="95" class="box gate"/>
  <text x="190" y="168" text-anchor="middle" class="text">g_step_down / g_gap</text>
  <text x="190" y="199" text-anchor="middle" class="small">检测到下坑或 gap</text>

  <rect x="400" y="130" width="230" height="95" class="box state"/>
  <text x="515" y="168" text-anchor="middle" class="text">drop_guard latch</text>
  <text x="515" y="199" text-anchor="middle" class="small">进入抗栽头状态</text>

  <rect x="720" y="110" width="260" height="135" class="box state"/>
  <text x="850" y="145" text-anchor="middle" class="text">监控姿态风险</text>
  <text x="850" y="178" text-anchor="middle" class="small">前车 pitch</text>
  <text x="850" y="207" text-anchor="middle" class="small">pitch rate / 向下速度</text>

  <rect x="1080" y="130" width="260" height="95" class="box penalty"/>
  <text x="1210" y="168" text-anchor="middle" class="text">drop_anti_dive_penalty</text>
  <text x="1210" y="199" text-anchor="middle" class="small">栽头、下坠、甩动扣分</text>

  <rect x="400" y="390" width="270" height="135" class="box release"/>
  <text x="535" y="426" text-anchor="middle" class="text">释放条件</text>
  <text x="535" y="459" text-anchor="middle" class="small">前轮支撑 >= 0.7</text>
  <text x="535" y="488" text-anchor="middle" class="small">pitch rate 小 / 下落速度小</text>

  <rect x="760" y="410" width="230" height="95" class="box release"/>
  <text x="875" y="448" text-anchor="middle" class="text">drop_guard 释放</text>
  <text x="875" y="479" text-anchor="middle" class="small">恢复普通阶段</text>

  <rect x="1060" y="380" width="310" height="150" class="box warn"/>
  <text x="1215" y="423" text-anchor="middle" class="text">当前缺口</text>
  <text x="1215" y="459" text-anchor="middle" class="small">抗栽头不是出坑动作</text>
  <text x="1215" y="489" text-anchor="middle" class="small">还需要前车主动抬出坑口</text>

  <path d="M310 178 H400" class="line"/>
  <path d="M630 178 H720" class="line"/>
  <path d="M980 178 H1080" class="line"/>
  <path d="M515 225 V390" class="line"/>
  <path d="M670 458 H760" class="line"/>
  <path d="M990 458 H1060" class="line"/>
  <path d="M1210 225 V380" class="line"/>
</svg>
