<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="660" viewBox="0 0 1500 660">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#475569"/></marker>
    <style>
      .title{font:700 30px "Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#0f172a}
      .box{rx:15;ry:15;stroke-width:2}
      .gate{fill:#dcfce7;stroke:#16a34a}
      .state{fill:#e0f2fe;stroke:#0284c7}
      .penalty{fill:#fee2e2;stroke:#dc2626}
      .reward{fill:#fef3c7;stroke:#d97706}
      .warn{fill:#fff7ed;stroke:#ea580c}
      .text{font:500 21px "Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#0f172a}
      .small{font:500 18px "Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#334155}
      .line{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1500" height="660" fill="#fff"/>
  <text x="750" y="48" text-anchor="middle" class="title">卡住与恢复链：三段式恢复动作链</text>

  <rect x="60" y="130" width="230" height="90" class="box gate"/>
  <text x="175" y="165" text-anchor="middle" class="text">hard gate 激活</text>
  <text x="175" y="194" text-anchor="middle" class="small">目标还在前方</text>

  <rect x="370" y="130" width="230" height="90" class="box state"/>
  <text x="485" y="165" text-anchor="middle" class="text">前进速度低</text>
  <text x="485" y="194" text-anchor="middle" class="small">疑似卡住</text>

  <rect x="680" y="130" width="230" height="90" class="box state"/>
  <text x="795" y="165" text-anchor="middle" class="text">stuck_time_s 增长</text>
  <text x="795" y="194" text-anchor="middle" class="small">持续统计</text>

  <rect x="990" y="90" width="230" height="90" class="box penalty"/>
  <text x="1105" y="125" text-anchor="middle" class="text">stuck_penalty</text>
  <text x="1105" y="154" text-anchor="middle" class="small">卡住扣分</text>

  <rect x="990" y="225" width="230" height="90" class="box state"/>
  <text x="1105" y="260" text-anchor="middle" class="text">recovery_active</text>
  <text x="1105" y="289" text-anchor="middle" class="small">进入恢复阶段</text>

  <rect x="670" y="390" width="260" height="95" class="box reward"/>
  <text x="800" y="427" text-anchor="middle" class="text">reverse_reward_now</text>
  <text x="800" y="458" text-anchor="middle" class="small">短窗口倒退小奖励</text>

  <rect x="990" y="390" width="260" height="95" class="box reward"/>
  <text x="1120" y="427" text-anchor="middle" class="text">recovery_success</text>
  <text x="1120" y="454" text-anchor="middle" class="small">已倒退 + no-progress 解除</text>
  <text x="1120" y="478" text-anchor="middle" class="small">重新前进或距离下降</text>

  <rect x="1285" y="325" width="180" height="160" class="box warn"/>
  <text x="1375" y="366" text-anchor="middle" class="text">检查</text>
  <text x="1375" y="403" text-anchor="middle" class="small">是否先倒退调姿</text>
  <text x="1375" y="433" text-anchor="middle" class="small">是否解除无进展</text>
  <text x="1375" y="463" text-anchor="middle" class="small">是否重新向前出坑</text>

  <path d="M290 175 H370" class="line"/>
  <path d="M600 175 H680" class="line"/>
  <path d="M910 160 C945 145 960 135 990 135" class="line"/>
  <path d="M910 190 C950 215 965 250 990 270" class="line"/>
  <path d="M1105 315 C1035 360 940 400 930 425" class="line"/>
  <path d="M1105 315 V390" class="line"/>
  <path d="M1250 438 H1285" class="line"/>
</svg>
