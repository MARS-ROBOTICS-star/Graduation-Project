<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="740" viewBox="0 0 1500 740">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#475569"/></marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#dc2626"/></marker>
    <style>
      .title{font:700 30px "Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#0f172a}
      .box{rx:15;ry:15;stroke-width:2}
      .q{fill:#e0f2fe;stroke:#0284c7}
      .score{fill:#dcfce7;stroke:#16a34a}
      .effect{fill:#fef3c7;stroke:#d97706}
      .warn{fill:#fee2e2;stroke:#dc2626}
      .text{font:500 21px "Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#0f172a}
      .small{font:500 18px "Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#334155}
      .line{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#dc2626;stroke-width:2.5;fill:none;stroke-dasharray:8 7;marker-end:url(#redArrow)}
    </style>
  </defs>
  <rect width="1500" height="740" fill="#fff"/>
  <text x="750" y="48" text-anchor="middle" class="title">质量分与 row 推进：质量在诊断和折减中存在，但不硬阻断 row</text>

  <rect x="70" y="95" width="220" height="70" class="box q"/><text x="180" y="137" text-anchor="middle" class="text">slip_quality</text>
  <rect x="70" y="190" width="220" height="70" class="box q"/><text x="180" y="232" text-anchor="middle" class="text">overspeed_quality</text>
  <rect x="70" y="285" width="220" height="70" class="box q"/><text x="180" y="327" text-anchor="middle" class="text">posture_quality</text>
  <rect x="70" y="380" width="220" height="70" class="box q"/><text x="180" y="422" text-anchor="middle" class="text">pitch_rate_quality</text>
  <rect x="70" y="475" width="220" height="70" class="box q"/><text x="180" y="517" text-anchor="middle" class="text">contact_quality</text>
  <rect x="70" y="570" width="220" height="70" class="box q"/><text x="180" y="612" text-anchor="middle" class="text">not_stuck_quality</text>

  <rect x="455" y="285" width="260" height="110" class="box score"/>
  <text x="585" y="325" text-anchor="middle" class="text">progress_quality_score</text>
  <text x="585" y="358" text-anchor="middle" class="small">取多个质量项的较小值</text>

  <rect x="870" y="120" width="260" height="100" class="box effect"/>
  <text x="1000" y="158" text-anchor="middle" class="text">折减正向 progress</text>
  <text x="1000" y="190" text-anchor="middle" class="small">但最低保留 0.2 倍</text>

  <rect x="870" y="310" width="260" height="100" class="box effect"/>
  <text x="1000" y="348" text-anchor="middle" class="text">高质量命中奖励</text>
  <text x="1000" y="380" text-anchor="middle" class="small">quality_row_advance_reward</text>

  <rect x="870" y="500" width="260" height="100" class="box warn"/>
  <text x="1000" y="538" text-anchor="middle" class="text">不会阻断 row</text>
  <text x="1000" y="570" text-anchor="middle" class="small">quality_gated = False</text>

  <rect x="1220" y="500" width="220" height="100" class="box warn"/>
  <text x="1330" y="538" text-anchor="middle" class="text">结果</text>
  <text x="1330" y="570" text-anchor="middle" class="small">低质量命中也可能升 row</text>

  <path d="M290 130 C355 190 400 280 455 315" class="line"/>
  <path d="M290 225 C360 250 405 300 455 325" class="line"/>
  <path d="M290 320 H455" class="line"/>
  <path d="M290 415 C360 395 405 365 455 350" class="line"/>
  <path d="M290 510 C355 465 400 390 455 365" class="line"/>
  <path d="M290 605 C355 535 400 430 455 380" class="line"/>
  <path d="M715 325 C785 260 820 190 870 170" class="line"/>
  <path d="M715 350 C775 360 815 360 870 360" class="line"/>
  <path d="M715 375 C785 445 820 520 870 550" class="dash"/>
  <path d="M1130 550 H1220" class="dash"/>
</svg>
