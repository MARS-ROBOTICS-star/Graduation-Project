<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#475569"/></marker>
    <style>
      .title{font:700 30px "Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#0f172a}
      .box{rx:15;ry:15;stroke-width:2}
      .start{fill:#e0f2fe;stroke:#0284c7}
      .decision{fill:#fef3c7;stroke:#d97706}
      .state{fill:#dcfce7;stroke:#16a34a}
      .warn{fill:#fee2e2;stroke:#dc2626}
      .text{font:500 21px "Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#0f172a}
      .small{font:500 18px "Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#334155}
      .line{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1500" height="760" fill="#fff"/>
  <text x="750" y="48" text-anchor="middle" class="title">curriculum 与 recycle：决定采样在哪里，不决定动作是否稳定</text>

  <rect x="60" y="120" width="220" height="90" class="box start"/>
  <text x="170" y="155" text-anchor="middle" class="text">env 命中目标</text>
  <text x="170" y="184" text-anchor="middle" class="small">waypoint_hit</text>

  <rect x="360" y="120" width="220" height="90" class="box state"/>
  <text x="470" y="155" text-anchor="middle" class="text">当前 row 推进</text>
  <text x="470" y="184" text-anchor="middle" class="small">terrain level + 1</text>

  <polygon points="760,100 890,165 760,230 630,165" class="decision" stroke-width="2"/>
  <text x="760" y="156" text-anchor="middle" class="text">是否达到</text>
  <text x="760" y="186" text-anchor="middle" class="text">max row?</text>

  <rect x="1010" y="75" width="240" height="90" class="box state"/>
  <text x="1130" y="110" text-anchor="middle" class="text">否：继续更高 row</text>
  <text x="1130" y="139" text-anchor="middle" class="small">仍在该列训练</text>

  <rect x="1010" y="235" width="240" height="90" class="box state"/>
  <text x="1130" y="270" text-anchor="middle" class="text">是：本 env 完成</text>
  <text x="1130" y="299" text-anchor="middle" class="small">column success + 1</text>

  <polygon points="760,380 910,455 760,530 610,455" class="decision" stroke-width="2"/>
  <text x="760" y="445" text-anchor="middle" class="text">hard column</text>
  <text x="760" y="475" text-anchor="middle" class="text">累计 >= 10?</text>

  <rect x="1010" y="395" width="240" height="90" class="box state"/>
  <text x="1130" y="430" text-anchor="middle" class="text">否：不退休</text>
  <text x="1130" y="459" text-anchor="middle" class="small">继续采样暴露问题</text>

  <rect x="1010" y="560" width="240" height="100" class="box state"/>
  <text x="1130" y="597" text-anchor="middle" class="text">是：completed-column</text>
  <text x="1130" y="628" text-anchor="middle" class="small">只保留 20% env</text>

  <rect x="320" y="570" width="260" height="100" class="box warn"/>
  <text x="450" y="607" text-anchor="middle" class="text">关键限制</text>
  <text x="450" y="638" text-anchor="middle" class="small">采样机制不能自动保证</text>
  <text x="450" y="666" text-anchor="middle" class="small">动作质量稳定</text>

  <path d="M280 165 H360" class="line"/>
  <path d="M580 165 H630" class="line"/>
  <path d="M890 145 C940 120 965 120 1010 120" class="line"/>
  <path d="M890 185 C940 230 965 260 1010 280" class="line"/>
  <path d="M1130 325 C1040 380 950 420 910 445" class="line"/>
  <path d="M910 435 H1010" class="line"/>
  <path d="M910 475 C960 540 985 590 1010 610" class="line"/>
  <path d="M1010 635 C860 690 650 690 580 635" class="line"/>
</svg>
